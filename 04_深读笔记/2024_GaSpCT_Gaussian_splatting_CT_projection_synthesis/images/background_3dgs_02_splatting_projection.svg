<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">三维高斯的泼溅投影与透明度合成</title>
  <desc id="desc">相机把多个三维高斯椭球投影成二维椭圆足迹，足迹覆盖多个像素，再按深度由近到远进行透明度合成。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FBFF"/><stop offset="1" stop-color="#EEF5FA"/></linearGradient>
    <radialGradient id="blueG"><stop offset="0" stop-color="#0072B2" stop-opacity="0.88"/><stop offset="0.55" stop-color="#56B4E9" stop-opacity="0.45"/><stop offset="1" stop-color="#56B4E9" stop-opacity="0.05"/></radialGradient>
    <radialGradient id="orangeG"><stop offset="0" stop-color="#D55E00" stop-opacity="0.86"/><stop offset="0.55" stop-color="#E69F00" stop-opacity="0.42"/><stop offset="1" stop-color="#E69F00" stop-opacity="0.04"/></radialGradient>
    <radialGradient id="purpleG"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0.82"/><stop offset="0.58" stop-color="#CC79A7" stop-opacity="0.40"/><stop offset="1" stop-color="#CC79A7" stop-opacity="0.04"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0072B2"/></marker>
    <style>
      .title{font:700 42px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#0F2942}.subtitle{font:400 23px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#475569}
      .panelTitle{font:700 28px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#17324D}.label{font:600 22px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#1E293B}
      .small{font:400 19px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#475569}.math{font:600 22px 'Cambria Math','Times New Roman',serif;fill:#17324D}
    </style>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text x="70" y="72" class="title">“泼溅”就是把三维椭球前向投影成二维软足迹</text>
  <text x="70" y="112" class="subtitle">每个足迹同时影响多个像素；重叠足迹再按深度由近到远进行 alpha 合成</text>

  <!-- Projection panel -->
  <rect x="55" y="150" width="950" height="610" rx="26" fill="#FFFFFF" stroke="#B6D7EA" stroke-width="2" filter="url(#shadow)"/>
  <text x="530" y="202" text-anchor="middle" class="panelTitle">① 三维高斯 → 二维椭圆足迹</text>

  <!-- camera -->
  <g transform="translate(105 378)">
    <rect x="0" y="0" width="120" height="100" rx="18" fill="#17324D"/>
    <polygon points="120,25 176,5 176,95 120,75" fill="#0072B2"/>
    <circle cx="35" cy="50" r="18" fill="#56B4E9" stroke="#FFFFFF" stroke-width="5"/>
    <text x="82" y="135" text-anchor="middle" class="label">相机</text>
    <text x="82" y="163" text-anchor="middle" class="math">O</text>
  </g>

  <!-- camera frustum -->
  <path d="M281 383 L826 230 M281 473 L826 680" fill="none" stroke="#94A3B8" stroke-width="3" stroke-dasharray="10 9"/>
  <line x1="282" y1="428" x2="815" y2="428" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="510" y="408" class="small">观察方向 / 视空间深度 z</text>

  <!-- 3D Gaussians -->
  <g transform="rotate(-20 500 430)"><ellipse cx="500" cy="430" rx="118" ry="62" fill="url(#blueG)" stroke="#0072B2" stroke-width="3"/><ellipse cx="500" cy="430" rx="76" ry="39" fill="none" stroke="#0072B2" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="7 6"/></g>
  <g transform="rotate(27 650 360)"><ellipse cx="650" cy="360" rx="104" ry="54" fill="url(#orangeG)" stroke="#D55E00" stroke-width="3"/><ellipse cx="650" cy="360" rx="68" ry="34" fill="none" stroke="#D55E00" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="7 6"/></g>
  <g transform="rotate(8 725 515)"><ellipse cx="725" cy="515" rx="126" ry="48" fill="url(#purpleG)" stroke="#8B5CF6" stroke-width="3"/><ellipse cx="725" cy="515" rx="82" ry="30" fill="none" stroke="#8B5CF6" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="7 6"/></g>
  <circle cx="500" cy="430" r="6" fill="#0F172A"/><circle cx="650" cy="360" r="6" fill="#0F172A"/><circle cx="725" cy="515" r="6" fill="#0F172A"/>
  <text x="560" y="590" text-anchor="middle" class="small">连续三维高斯基元</text>

  <!-- projection plane -->
  <polygon points="826,220 948,250 948,655 826,690" fill="#EAF4FA" stroke="#0072B2" stroke-width="4"/>
  <g stroke="#B6D7EA" stroke-width="1.5" opacity="0.9">
    <line x1="850" y1="226" x2="850" y2="683"/><line x1="874" y1="232" x2="874" y2="677"/><line x1="898" y1="238" x2="898" y2="670"/><line x1="922" y1="244" x2="922" y2="663"/>
    <line x1="826" y1="310" x2="948" y2="327"/><line x1="826" y1="400" x2="948" y2="405"/><line x1="826" y1="490" x2="948" y2="484"/><line x1="826" y1="580" x2="948" y2="562"/>
  </g>
  <g transform="rotate(-12 884 420)"><ellipse cx="884" cy="420" rx="53" ry="26" fill="url(#blueG)" stroke="#0072B2" stroke-width="2.5"/></g>
  <g transform="rotate(20 887 347)"><ellipse cx="887" cy="347" rx="48" ry="22" fill="url(#orangeG)" stroke="#D55E00" stroke-width="2.5"/></g>
  <g transform="rotate(5 890 520)"><ellipse cx="890" cy="520" rx="58" ry="21" fill="url(#purpleG)" stroke="#8B5CF6" stroke-width="2.5"/></g>
  <text x="887" y="722" text-anchor="middle" class="label">图像平面</text>
  <text x="887" y="746" text-anchor="middle" class="small">一个足迹覆盖多个像素</text>

  <rect x="315" y="630" width="445" height="86" rx="18" fill="#EFF8FD" stroke="#8ECAE6" stroke-width="2"/>
  <text x="538" y="662" text-anchor="middle" class="math">Σ²ᴰ ≈ [ J W Σ Wᵀ Jᵀ ]₂×₂</text>
  <text x="538" y="694" text-anchor="middle" class="small">在高斯中心处用投影雅可比作局部线性近似</text>

  <!-- Composite panel -->
  <rect x="1035" y="150" width="510" height="610" rx="26" fill="#FFFFFF" stroke="#D9C8F2" stroke-width="2" filter="url(#shadow)"/>
  <text x="1290" y="202" text-anchor="middle" class="panelTitle">② 重叠足迹 → 合成像素</text>
  <line x1="1110" y1="248" x2="1470" y2="248" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1290" y="236" text-anchor="middle" class="small">近　　　　　　　　　　　　远</text>
  <text x="1290" y="282" text-anchor="middle" class="small">按高斯中心深度预排序；同一图像分块共用近似顺序</text>

  <g transform="rotate(-15 1190 390)"><ellipse cx="1190" cy="390" rx="128" ry="70" fill="url(#blueG)" stroke="#0072B2" stroke-width="3"/></g>
  <g transform="rotate(17 1300 405)"><ellipse cx="1300" cy="405" rx="128" ry="68" fill="url(#orangeG)" stroke="#D55E00" stroke-width="3"/></g>
  <g transform="rotate(5 1390 420)"><ellipse cx="1390" cy="420" rx="124" ry="64" fill="url(#purpleG)" stroke="#8B5CF6" stroke-width="3"/></g>
  <text x="1090" y="342" class="math" fill="#0072B2">z₁</text>
  <text x="1285" y="334" class="math" fill="#D55E00">z₂</text>
  <text x="1450" y="380" class="math" fill="#8B5CF6">z₃</text>
  <circle cx="1300" cy="405" r="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="4"/>
  <line x1="1300" y1="415" x2="1300" y2="500" stroke="#334155" stroke-width="3" stroke-dasharray="7 6"/>
  <text x="1300" y="525" text-anchor="middle" class="label">目标像素 p</text>

  <rect x="1070" y="545" width="440" height="112" rx="18" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
  <text x="1290" y="575" text-anchor="middle" class="math">aᵢ(p) = oᵢ Gᵢ²ᴰ(p)</text>
  <text x="1130" y="612" class="math" fill="#0072B2">T₁a₁c₁</text>
  <text x="1218" y="612" class="math">+</text>
  <text x="1248" y="612" class="math" fill="#D55E00">T₂a₂c₂</text>
  <text x="1336" y="612" class="math">+</text>
  <text x="1366" y="612" class="math" fill="#8B5CF6">T₃a₃c₃ + …</text>
  <text x="1290" y="642" text-anchor="middle" class="math">Tᵢ = ∏ⱼ&lt;ᵢ (1 − aⱼ)</text>
  <line x1="1290" y1="659" x2="1290" y2="675" stroke="#0072B2" stroke-width="4"/>
  <polygon points="1277,673 1303,673 1290,689" fill="#0072B2"/>
  <rect x="1130" y="690" width="320" height="46" rx="16" fill="#17324D"/>
  <text x="1290" y="721" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">最终像素 Ĉ(p)</text>

  <rect x="155" y="802" width="1290" height="62" rx="24" fill="#0F2942"/>
  <text x="800" y="841" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="23" font-weight="600" fill="#FFFFFF">泼溅 ≠ 射线步进 ≠ X 射线散射；它是“基元 → 像素”的前向投影与软覆盖</text>
</svg>
