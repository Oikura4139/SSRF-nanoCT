<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">三维高斯泼溅的空间纹理与球谐视角颜色</title>
  <desc id="desc">左侧说明空间纹理由许多位置和基础色不同的高斯共同形成，右侧说明同一高斯的颜色可随观察方向平滑变化，底部列出四个球谐频带。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FBFF"/><stop offset="1" stop-color="#EEF5FA"/></linearGradient>
    <radialGradient id="gBlue"><stop offset="0" stop-color="#0072B2" stop-opacity="0.94"/><stop offset="0.55" stop-color="#56B4E9" stop-opacity="0.55"/><stop offset="1" stop-color="#56B4E9" stop-opacity="0.06"/></radialGradient>
    <radialGradient id="gGreen"><stop offset="0" stop-color="#009E73" stop-opacity="0.92"/><stop offset="0.58" stop-color="#73C8A9" stop-opacity="0.50"/><stop offset="1" stop-color="#73C8A9" stop-opacity="0.06"/></radialGradient>
    <radialGradient id="gOrange"><stop offset="0" stop-color="#D55E00" stop-opacity="0.90"/><stop offset="0.58" stop-color="#E69F00" stop-opacity="0.50"/><stop offset="1" stop-color="#E69F00" stop-opacity="0.06"/></radialGradient>
    <radialGradient id="gPurple"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0.90"/><stop offset="0.58" stop-color="#CC79A7" stop-opacity="0.48"/><stop offset="1" stop-color="#CC79A7" stop-opacity="0.06"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0072B2"/></marker>
    <style>
      .title{font:700 42px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#0F2942}.subtitle{font:400 23px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#475569}
      .panelTitle{font:700 27px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#17324D}.label{font:600 21px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#1E293B}
      .small{font:400 19px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#475569}.math{font:600 22px 'Cambria Math','Times New Roman',serif;fill:#17324D}
    </style>
  </defs>
  <rect width="1600" height="980" rx="28" fill="url(#bg)"/>
  <text x="70" y="70" class="title">3DGS 的“纹理”来自两件不同的事</text>
  <text x="70" y="110" class="subtitle">空间细节由许多高斯共同拼出；球谐函数只描述单个高斯随观察方向变化的低频颜色</text>

  <!-- Left panel: spatial texture -->
  <rect x="55" y="145" width="735" height="560" rx="26" fill="#FFFFFF" stroke="#B6D7EA" stroke-width="2" filter="url(#shadow)"/>
  <text x="423" y="195" text-anchor="middle" class="panelTitle">① 许多高斯共同形成空间纹理</text>
  <text x="423" y="228" text-anchor="middle" class="small">没有一张固定的 UV 贴图</text>

  <!-- Gaussian cloud -->
  <g>
    <g transform="rotate(-18 180 360)"><ellipse cx="180" cy="360" rx="86" ry="43" fill="url(#gBlue)" stroke="#0072B2" stroke-width="2"/></g>
    <g transform="rotate(25 280 315)"><ellipse cx="280" cy="315" rx="72" ry="39" fill="url(#gOrange)" stroke="#D55E00" stroke-width="2"/></g>
    <g transform="rotate(8 365 390)"><ellipse cx="365" cy="390" rx="92" ry="38" fill="url(#gGreen)" stroke="#009E73" stroke-width="2"/></g>
    <g transform="rotate(-30 245 455)"><ellipse cx="245" cy="455" rx="78" ry="35" fill="url(#gPurple)" stroke="#8B5CF6" stroke-width="2"/></g>
    <g transform="rotate(15 395 285)"><ellipse cx="395" cy="285" rx="68" ry="32" fill="url(#gPurple)" stroke="#8B5CF6" stroke-width="2"/></g>
    <g transform="rotate(-8 430 490)"><ellipse cx="430" cy="490" rx="82" ry="40" fill="url(#gOrange)" stroke="#D55E00" stroke-width="2"/></g>
    <g transform="rotate(35 330 530)"><ellipse cx="330" cy="530" rx="70" ry="30" fill="url(#gBlue)" stroke="#0072B2" stroke-width="2"/></g>
    <g transform="rotate(-20 175 540)"><ellipse cx="175" cy="540" rx="62" ry="30" fill="url(#gGreen)" stroke="#009E73" stroke-width="2"/></g>
  </g>
  <text x="290" y="625" text-anchor="middle" class="label">不同位置 · 不同尺度 · 不同基础色</text>
  <line x1="485" y1="410" x2="555" y2="410" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- small rendered patch -->
  <rect x="575" y="285" width="155" height="250" rx="16" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/>
  <g opacity="0.95">
    <rect x="590" y="300" width="42" height="42" rx="8" fill="#56B4E9"/><rect x="636" y="300" width="35" height="42" rx="8" fill="#E69F00"/><rect x="675" y="300" width="40" height="42" rx="8" fill="#CC79A7"/>
    <rect x="590" y="346" width="58" height="46" rx="8" fill="#0072B2"/><rect x="652" y="346" width="63" height="46" rx="8" fill="#009E73"/>
    <rect x="590" y="396" width="36" height="58" rx="8" fill="#CC79A7"/><rect x="630" y="396" width="52" height="58" rx="8" fill="#D55E00"/><rect x="686" y="396" width="29" height="58" rx="8" fill="#56B4E9"/>
    <rect x="590" y="458" width="51" height="62" rx="8" fill="#009E73"/><rect x="645" y="458" width="70" height="62" rx="8" fill="#8B5CF6"/>
  </g>
  <text x="652" y="572" text-anchor="middle" class="label">合成图像</text>
  <text x="652" y="600" text-anchor="middle" class="small">空间细节在像素中显现</text>

  <!-- Right panel: view-dependent SH -->
  <rect x="820" y="145" width="725" height="560" rx="26" fill="#FFFFFF" stroke="#D9C8F2" stroke-width="2" filter="url(#shadow)"/>
  <text x="1183" y="195" text-anchor="middle" class="panelTitle">② 同一高斯的颜色随观察方向平滑变化</text>
  <text x="1183" y="228" text-anchor="middle" class="small">几何形状不变；只改变 cᵢ(d)</text>

  <!-- central gaussian -->
  <g transform="rotate(-15 1180 430)"><ellipse cx="1180" cy="430" rx="140" ry="76" fill="url(#gBlue)" stroke="#0072B2" stroke-width="4"/><ellipse cx="1180" cy="430" rx="88" ry="45" fill="none" stroke="#FFFFFF" stroke-opacity="0.72" stroke-width="2" stroke-dasharray="8 6"/></g>
  <circle cx="1180" cy="430" r="8" fill="#0F172A"/>
  <rect x="850" y="525" width="285" height="54" rx="14" fill="#EFF8FD" stroke="#8ECAE6" stroke-width="2"/>
  <text x="993" y="559" text-anchor="middle" class="label">几何固定：μᵢ、Sᵢ、Rᵢ</text>

  <!-- cameras and view directions -->
  <g transform="translate(925 285)"><rect width="72" height="52" rx="10" fill="#17324D"/><polygon points="72,13 106,2 106,50 72,39" fill="#0072B2"/><circle cx="23" cy="26" r="10" fill="#56B4E9" stroke="#FFFFFF" stroke-width="3"/></g>
  <line x1="1025" y1="338" x2="1090" y2="385" stroke="#0072B2" stroke-width="4" marker-end="url(#arrowBlue)"/><text x="1018" y="375" class="math">d₁</text>
  <rect x="900" y="365" width="128" height="44" rx="12" fill="#0072B2"/><text x="964" y="394" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">蓝色偏深</text>

  <g transform="translate(1325 276)"><rect width="72" height="52" rx="10" fill="#17324D"/><polygon points="0,13 -34,2 -34,50 0,39" fill="#0072B2"/><circle cx="49" cy="26" r="10" fill="#56B4E9" stroke="#FFFFFF" stroke-width="3"/></g>
  <line x1="1320" y1="335" x2="1270" y2="382" stroke="#0072B2" stroke-width="4" marker-end="url(#arrowBlue)"/><text x="1300" y="370" class="math">d₂</text>
  <rect x="1338" y="362" width="135" height="44" rx="12" fill="#009E73"/><text x="1405" y="391" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">略偏青绿</text>

  <g transform="translate(1145 595)"><rect width="72" height="52" rx="10" fill="#17324D"/><polygon points="18,0 4,-34 68,-34 54,0" fill="#0072B2"/><circle cx="36" cy="27" r="10" fill="#56B4E9" stroke="#FFFFFF" stroke-width="3"/></g>
  <line x1="1181" y1="586" x2="1181" y2="520" stroke="#0072B2" stroke-width="4" marker-end="url(#arrowBlue)"/><text x="1197" y="570" class="math">d₃</text>
  <rect x="1230" y="588" width="135" height="44" rx="12" fill="#8B5CF6"/><text x="1298" y="617" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">略偏紫色</text>

  <!-- SH band strip -->
  <text x="800" y="755" text-anchor="middle" class="panelTitle">低阶球谐：四个频带，不是“最高 4 阶”</text>
  <g filter="url(#shadow)">
    <rect x="80" y="790" width="330" height="120" rx="20" fill="#FFFFFF" stroke="#0072B2" stroke-width="3"/>
    <text x="245" y="834" text-anchor="middle" class="math">ℓ = 0</text><text x="245" y="870" text-anchor="middle" class="label">常量基础色 · 1 个基函数</text>
    <rect x="450" y="790" width="330" height="120" rx="20" fill="#FFFFFF" stroke="#009E73" stroke-width="3"/>
    <text x="615" y="834" text-anchor="middle" class="math">ℓ = 1</text><text x="615" y="870" text-anchor="middle" class="label">粗略方向变化 · 3 个基函数</text>
    <rect x="820" y="790" width="330" height="120" rx="20" fill="#FFFFFF" stroke="#E69F00" stroke-width="3"/>
    <text x="985" y="834" text-anchor="middle" class="math">ℓ = 2</text><text x="985" y="870" text-anchor="middle" class="label">中等方向变化 · 5 个基函数</text>
    <rect x="1190" y="790" width="330" height="120" rx="20" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="3"/>
    <text x="1355" y="834" text-anchor="middle" class="math">ℓ = 3</text><text x="1355" y="870" text-anchor="middle" class="label">更细方向变化 · 7 个基函数</text>
  </g>
  <rect x="350" y="930" width="900" height="36" rx="18" fill="#0F2942"/>
  <text x="800" y="955" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="19" font-weight="600" fill="#FFFFFF">共 1 + 3 + 5 + 7 = 16 个基函数 / 颜色通道；最高次数为 3</text>
</svg>
