<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">一次原位实验的多源数据必须按共同时间轴同步</title>
  <desc id="desc">探测器帧、样品位置、原位环境、光束状态和操作事件按共同时间轴记录，并和标定、身份、配方及校验和一起打包成可解释的一次实验运行数据。</desc>
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f5f7fb"/></linearGradient>
    <filter id="sh4"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1f3144" flood-opacity="0.13"/></filter>
    <marker id="ar4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#475569"/></marker>
    <style>
      .sans { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif; }
      .title { font-size: 34px; font-weight: 750; fill: #17324d; }
      .sub { font-size: 18px; fill: #52677b; }
      .h { font-size: 20px; font-weight: 700; fill: #17324d; }
      .b { font-size: 16px; fill: #29465f; }
      .s { font-size: 14px; fill: #52677b; }
      .lightb { font-size: 16px; fill: #dbeafe; }
      .lights { font-size: 14px; fill: #cbd5e1; }
    </style>
  </defs>
  <rect width="1400" height="820" rx="26" fill="url(#bg4)"/>
  <text x="67" y="67" class="sans title">原位数据不是“实验之后的数据”，而是与探测器同步的上下文</text>
  <text x="67" y="101" class="sans sub">同一帧究竟对应多少度、多少摄氏度、多少伏、什么束流状态，决定了它有没有科学含义。</text>

  <!-- Timeline area -->
  <rect x="55" y="143" width="925" height="555" rx="22" fill="#ffffff" stroke="#d7e0e8" stroke-width="2" filter="url(#sh4)"/>
  <line x1="228" y1="194" x2="920" y2="194" stroke="#475569" stroke-width="3" marker-end="url(#ar4)"/>
  <text x="228" y="177" class="sans h">共同时间轴</text>
  <text x="247" y="221" class="sans s">t0</text><text x="407" y="221" class="sans s">t1</text><text x="567" y="221" class="sans s">t2</text><text x="727" y="221" class="sans s">t3</text><text x="887" y="221" class="sans s">tn</text>
  <g stroke="#d8e2ea" stroke-width="2" stroke-dasharray="5 7">
    <line x1="255" y1="228" x2="255" y2="658"/><line x1="415" y1="228" x2="415" y2="658"/><line x1="575" y1="228" x2="575" y2="658"/><line x1="735" y1="228" x2="735" y2="658"/><line x1="895" y1="228" x2="895" y2="658"/>
  </g>

  <!-- Row labels -->
  <text x="76" y="282" class="sans h">探测器</text><text x="76" y="307" class="sans s">帧 / 计数</text>
  <text x="76" y="372" class="sans h">样品坐标</text><text x="76" y="397" class="sans s">角度 / 位移</text>
  <text x="76" y="462" class="sans h">原位环境</text><text x="76" y="487" class="sans s">温压 / 电化学</text>
  <text x="76" y="552" class="sans h">光束状态</text><text x="76" y="577" class="sans s">I0 / 位置</text>
  <text x="76" y="642" class="sans h">事件日志</text><text x="76" y="667" class="sans s">光闸 / 报警</text>

  <!-- Detector row -->
  <g fill="#ede9fe" stroke="#7c3aed" stroke-width="2">
    <rect x="235" y="251" width="96" height="61" rx="8"/><rect x="395" y="251" width="96" height="61" rx="8"/><rect x="555" y="251" width="96" height="61" rx="8"/><rect x="715" y="251" width="96" height="61" rx="8"/><rect x="875" y="251" width="62" height="61" rx="8"/>
  </g>
  <g class="sans b" fill="#5b21b6"><text x="283" y="287" text-anchor="middle">frame 0</text><text x="443" y="287" text-anchor="middle">frame 1</text><text x="603" y="287" text-anchor="middle">frame 2</text><text x="763" y="287" text-anchor="middle">frame 3</text><text x="906" y="287" text-anchor="middle">…</text></g>

  <!-- sample coordinates -->
  <path d="M235 373 C315 335 355 411 415 373 S515 335 575 373 S675 411 735 373 S835 335 925 373" fill="none" stroke="#ea580c" stroke-width="5"/>
  <g class="sans s" fill="#9a3412"><text x="255" y="347">0°</text><text x="415" y="421">45°</text><text x="575" y="347">90°</text><text x="735" y="421">135°</text><text x="895" y="347">180°</text></g>

  <!-- environment -->
  <path d="M235 474 H385 L415 445 H575 L605 430 H735 L765 474 H925" fill="none" stroke="#dc2626" stroke-width="5"/>
  <g class="sans s" fill="#991b1b"><text x="270" y="452">25 ℃</text><text x="452" y="428">升温</text><text x="624" y="414">120 ℃</text><text x="793" y="452">降温</text></g>

  <!-- beam state -->
  <path d="M235 555 L315 550 L395 559 L475 551 L555 554 L635 552 L715 558 L795 550 L875 555 L925 553" fill="none" stroke="#0891b2" stroke-width="5"/>
  <circle cx="635" cy="552" r="12" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
  <text x="651" y="535" class="sans s" fill="#92400e">top-up</text>

  <!-- events -->
  <g class="sans s">
    <rect x="235" y="616" width="96" height="43" rx="9" fill="#dcfce7" stroke="#16a34a"/><text x="283" y="643" text-anchor="middle" fill="#166534">光闸打开</text>
    <rect x="395" y="616" width="96" height="43" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="443" y="643" text-anchor="middle" fill="#1e40af">开始扫描</text>
    <rect x="555" y="616" width="96" height="43" rx="9" fill="#fee2e2" stroke="#dc2626"/><text x="603" y="643" text-anchor="middle" fill="#991b1b">短暂报警</text>
    <rect x="715" y="616" width="96" height="43" rx="9" fill="#fef3c7" stroke="#d97706"/><text x="763" y="643" text-anchor="middle" fill="#92400e">补拍一帧</text>
    <rect x="875" y="616" width="62" height="43" rx="9" fill="#e2e8f0" stroke="#64748b"/><text x="906" y="643" text-anchor="middle" fill="#334155">结束</text>
  </g>

  <!-- Bundle -->
  <path d="M981 420 H1030" stroke="#475569" stroke-width="5" marker-end="url(#ar4)"/>
  <rect x="1040" y="143" width="305" height="555" rx="22" fill="#17324d" filter="url(#sh4)"/>
  <text x="1068" y="187" class="sans" font-size="24" font-weight="750" fill="#fff">一次 Run 数据包</text>
  <g class="sans lightb">
    <text x="1068" y="237">① 探测器原始数组</text>
    <text x="1068" y="281">② 帧级时间戳与坐标</text>
    <text x="1068" y="325">③ 原位环境与束流读回</text>
    <text x="1068" y="369">④ dark / flat / I0 标定</text>
    <text x="1068" y="413">⑤ 样品、配方与设备身份</text>
    <text x="1068" y="457">⑥ 报警、人工操作与补拍</text>
    <text x="1068" y="501">⑦ 文件校验和与访问权限</text>
    <text x="1068" y="545">⑧ 软件和处理血缘</text>
  </g>
  <line x1="1068" y1="574" x2="1318" y2="574" stroke="#6f93b3"/>
  <text x="1068" y="610" class="sans" font-size="17" font-weight="700" fill="#fde68a">核心要求：同钟、同标识、可回放</text>
  <text x="1068" y="642" class="sans lights">否则只能看到信号，无法可靠解释</text>
  <text x="1068" y="667" class="sans lights">信号对应的真实实验状态。</text>

  <rect x="55" y="731" width="1290" height="50" rx="16" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="700" y="763" text-anchor="middle" class="sans" font-size="17" font-weight="700" fill="#9a3412">原位 / 工况数据与探测器数据是并行数据流；补充表征平台的数据则通常在之后通过 sample_id 或 ROI 坐标关联。</text>
</svg>
