<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">从电子注入到多条光束线的结构示意</title>
  <desc id="desc">电子枪产生电子，经直线加速器和增强器加速后注入储存环。电子在环中循环，在弯转磁铁或插入件处产生同步辐射光，光子沿切线方向进入多条光束线，电子不进入光束线。</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071a2d"/><stop offset="1" stop-color="#102d49"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="aBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#62b4ff"/></marker>
    <marker id="aGold" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#fbbf24"/></marker>
    <style>
      .sans { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif; }
      .title { font-size: 34px; font-weight: 750; fill: #f8fafc; }
      .sub { font-size: 18px; fill: #b9d4ec; }
      .h { font-size: 22px; font-weight: 700; fill: #eff8ff; }
      .b { font-size: 17px; fill: #c8def1; }
      .s { font-size: 15px; fill: #9fc1de; }
    </style>
  </defs>
  <rect width="1400" height="820" rx="26" fill="url(#bg2)"/>
  <text x="68" y="67" class="sans title">电子绕环，光子出环：为何一台加速器能服务多条线站</text>
  <text x="68" y="101" class="sans sub">这是功能示意图；光束线来自预先设计的光源点，并非储存环上任意一个切向都能接一条线。</text>

  <!-- Injector chain -->
  <g>
    <rect x="65" y="155" width="142" height="78" rx="16" fill="#173f63" stroke="#62b4ff" stroke-width="2"/>
    <rect x="250" y="155" width="190" height="78" rx="16" fill="#173f63" stroke="#62b4ff" stroke-width="2"/>
    <rect x="485" y="155" width="190" height="78" rx="16" fill="#173f63" stroke="#62b4ff" stroke-width="2"/>
    <text x="136" y="188" text-anchor="middle" class="sans h">电子枪</text>
    <text x="136" y="216" text-anchor="middle" class="sans s">产生电子束</text>
    <text x="345" y="188" text-anchor="middle" class="sans h">直线加速器</text>
    <text x="345" y="216" text-anchor="middle" class="sans s">第一次升能</text>
    <text x="580" y="188" text-anchor="middle" class="sans h">增强器</text>
    <text x="580" y="216" text-anchor="middle" class="sans s">升到储存能量</text>
    <path d="M208 194 H242" stroke="#62b4ff" stroke-width="5" marker-end="url(#aBlue)"/>
    <path d="M441 194 H477" stroke="#62b4ff" stroke-width="5" marker-end="url(#aBlue)"/>
    <path d="M676 194 C735 194 739 282 771 305" fill="none" stroke="#62b4ff" stroke-width="5" marker-end="url(#aBlue)"/>
    <text x="708" y="178" class="sans s">按运行模式注入</text>
  </g>

  <!-- Storage ring -->
  <ellipse cx="700" cy="505" rx="355" ry="212" fill="#0d2237" stroke="#407aa6" stroke-width="19"/>
  <ellipse cx="700" cy="505" rx="306" ry="163" fill="none" stroke="#62b4ff" stroke-width="5" stroke-dasharray="18 13"/>
  <path d="M477 394 C545 321 658 319 743 345" fill="none" stroke="#62b4ff" stroke-width="5" marker-end="url(#aBlue)"/>
  <text x="700" y="472" text-anchor="middle" class="sans" font-size="32" font-weight="750" fill="#f8fafc">电子储存环</text>
  <text x="700" y="508" text-anchor="middle" class="sans b">磁铁控制轨道，高频系统补回辐射损失的能量</text>
  <text x="700" y="542" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#7dd3fc">电子束在环内循环</text>

  <!-- Source points and tangent photon lines -->
  <g filter="url(#glow)">
    <circle cx="472" cy="348" r="14" fill="#fbbf24"/>
    <circle cx="995" cy="410" r="14" fill="#fbbf24"/>
    <circle cx="900" cy="665" r="14" fill="#fbbf24"/>
  </g>
  <path d="M472 348 L319 260 L205 260" fill="none" stroke="#fbbf24" stroke-width="7" marker-end="url(#aGold)"/>
  <path d="M995 410 L1165 327 L1315 327" fill="none" stroke="#fbbf24" stroke-width="7" marker-end="url(#aGold)"/>
  <path d="M900 665 L1083 735 L1315 735" fill="none" stroke="#fbbf24" stroke-width="7" marker-end="url(#aGold)"/>

  <g>
    <rect x="64" y="244" width="142" height="54" rx="13" fill="#4a3710" stroke="#fbbf24" stroke-width="2"/>
    <rect x="1180" y="300" width="153" height="54" rx="13" fill="#4a3710" stroke="#fbbf24" stroke-width="2"/>
    <rect x="1180" y="708" width="153" height="54" rx="13" fill="#4a3710" stroke="#fbbf24" stroke-width="2"/>
    <text x="135" y="277" text-anchor="middle" class="sans h">光束线 A</text>
    <text x="1256" y="334" text-anchor="middle" class="sans h">光束线 B</text>
    <text x="1256" y="742" text-anchor="middle" class="sans h">光束线 N</text>
  </g>

  <rect x="75" y="358" width="235" height="205" rx="18" fill="#102f4b" stroke="#477da7" stroke-width="2"/>
  <text x="98" y="394" class="sans h">加速器关心什么？</text>
  <text x="98" y="432" class="sans b">• 束流流强与寿命</text>
  <text x="98" y="466" class="sans b">• 轨道位置与能量</text>
  <text x="98" y="500" class="sans b">• 束团时间结构</text>
  <text x="98" y="534" class="sans b">• 真空、温度、联锁</text>

  <rect x="1084" y="426" width="250" height="206" rx="18" fill="#4a3710" stroke="#fbbf24" stroke-width="2"/>
  <text x="1108" y="463" class="sans h" fill="#fff7d6">光源点是什么？</text>
  <text x="1108" y="501" class="sans b" fill="#ffe9a6">弯转磁铁或插入件</text>
  <text x="1108" y="535" class="sans b" fill="#ffe9a6">使相对论电子偏转，</text>
  <text x="1108" y="569" class="sans b" fill="#ffe9a6">产生沿前进方向集中的</text>
  <text x="1108" y="603" class="sans b" fill="#ffe9a6">同步辐射光子束。</text>

  <rect x="425" y="748" width="550" height="42" rx="21" fill="#173f63" stroke="#62b4ff" stroke-width="2"/>
  <text x="700" y="776" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#d8efff">蓝色 = 电子束路径　　黄色 = 同步辐射光子束路径</text>
</svg>
